<!doctype html>
<html lang="pt-br" data-tema="escuro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quorbe | Turmas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/turmas.css" />
    <script src="/assets/js/auth.js"></script>
    <script>
        // Exige que o usuário seja professor para acessar o gerenciamento
        exigirFuncao('professor');
    </script>
    <style>
      /* Ajustes adicionais para garantir que os componentes respeitem o tema */
      .list-group-item {
        background-color: var(--cor-superficie);
        border-color: var(--cor-borda);
        color: var(--cor-texto);
      }
      .nav-underline .nav-link {
        color: var(--cor-texto);
        opacity: 0.8;
      }
      .nav-underline .nav-link:hover {
        opacity: 1;
      }
      .nav-underline .nav-link.active {
        color: var(--cor-secundaria);
        border-bottom-color: var(--cor-secundaria);
        font-weight: bold;
        opacity: 1;
      }
      .modal-content {
        background-color: var(--cor-superficie);
        color: var(--cor-texto);
        border: 1px solid var(--cor-borda);
      }
      .modal-header, .modal-footer {
        border-color: var(--cor-borda);
      }
      .form-control, .form-select {
        background-color: var(--cor-fundo);
        border-color: var(--cor-borda);
        color: var(--cor-texto);
      }
      .form-control:focus, .form-select:focus {
        background-color: var(--cor-fundo);
        color: var(--cor-texto);
        border-color: var(--cor-secundaria);
        box-shadow: 0 0 0 0.25rem color-mix(in srgb, var(--cor-secundaria) 25%, transparent);
      }
      /* Ajuste da cor do botão de fechar modal (X) para temas escuros */
      [data-tema="escuro"] .btn-close {
        filter: invert(1) grayscale(100%) brightness(200%);
      }
    </style>
  </head>
  <body>
    <!-- Ícones SVG -->

    <main class="d-flex flex-nowrap" style="min-height: 100vh;">
      
      <!-- SIDEBAR PROFESSOR -->
      <div class="d-flex flex-column flex-shrink-0 p-3 sidebar" style="width: 280px; background-color: var(--cor-superficie); color: var(--cor-texto);">
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
          <svg class="bi pe-none me-2" width="40" height="32" aria-hidden="true"><use href="#bootstrap"></use></svg>
          <span class="fs-4" style="color: var(--cor-texto);">Quorbe</span>
        </a>
        <hr style="border-color: var(--cor-borda);" />
        
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item">
            <a href="home.html" class="nav-link link-body-emphasis" style="color: var(--cor-texto) !important;">
              <svg class="bi pe-none me-2" width="16" height="16" fill="currentColor"><use href="#home"></use></svg>
              Página Inicial
            </a>
          </li>
          <li>
            <a href="tarefas.html" class="nav-link link-body-emphasis" style="color: var(--cor-texto) !important;">
              <svg class="bi pe-none me-2" width="16" height="16" fill="currentColor"><use href="#speedometer2"></use></svg>
              Tarefas
            </a>
          </li>
          <!-- Turmas ATIVO aqui -->
          <li>
            <a href="turmas.html" class="nav-link active" aria-current="page" style="background-color: var(--cor-secundaria); color: var(--cor-sobre-secundaria);">
              <svg class="bi pe-none me-2" width="16" height="16" fill="currentColor"><use href="#table"></use></svg>
              Turmas
            </a>
          </li>
          <li>
            <a href="calendario.html" class="nav-link link-body-emphasis" style="color: var(--cor-texto) !important;">
              <svg class="bi pe-none me-2" width="16" height="16" fill="currentColor"><use href="#grid"></use></svg>
              Calendário
            </a>
          </li>
          <li>
            <a href="perfil.html" class="nav-link link-body-emphasis" style="color: var(--cor-texto) !important;">
              <svg class="bi pe-none me-2" width="16" height="16" fill="currentColor"><use href="#people-circle"></use></svg>
              Perfil
            </a>
          </li>
        </ul>
        <hr style="border-color: var(--cor-borda);" />
        <div class="dropdown">
          <a href="#" class="d-flex align-items-center link-body-emphasis text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" style="color: var(--cor-texto) !important;">
            <img src="https://github.com/mdo.png" alt="" width="32" height="32" class="rounded-circle me-2" id="imgUsuarioBarra" />
            <strong id="nomeUsuarioBarra">Professor</strong>
          </a>
          <ul class="dropdown-menu text-small shadow" style="background-color: var(--cor-superficie);">
            <li><a class="dropdown-item" href="perfil.html" style="color: var(--cor-texto);">Perfil</a></li>
            <li><hr class="dropdown-divider" style="border-color: var(--cor-borda);" /></li>
            <li><a class="dropdown-item" href="#" onclick="sair()" style="color: var(--cor-texto);">Sair</a></li>
          </ul>
        </div>
      </div>

      <!-- CONTEÚDO PRINCIPAL (TURMAS) -->
      <div class="flex-grow-1 p-4 overflow-auto" style="background-color: var(--cor-fundo); color: var(--cor-texto);">
        <ul class="nav nav-underline abas mb-4" style="border-bottom: 1px solid var(--cor-borda);">
          <li class="nav-item"><a class="nav-link active" href="turmas.html">Turmas</a></li>
          <li class="nav-item"><a class="nav-link disabled" href="#" aria-disabled="true" tabindex="-1" title="Em desenvolvimento">Grupos</a></li>
          <li class="nav-item"><a class="nav-link" href="alunos.html">Alunos</a></li>
        </ul>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <h1 class="h4 mb-0 fw-bold">Gestão de Turmas</h1>
          <button type="button" class="btn" id="btnNova" style="background-color: var(--cor-secundaria); color: var(--cor-sobre-secundaria);">
            <i class="bi bi-plus-lg me-1"></i> Criar turma
          </button>
        </div>

        <div id="alerta" class="alert alert-danger d-none"></div>

        <!-- Lista populada pelo turmas.js -->
        <div class="list-group shadow-sm" id="listaTurmas" style="border-radius: 0.75rem;"></div>
      </div>
    </main>

    <!-- MODAL: Criar / Editar Turma -->
    <div class="modal fade" id="modalTurma" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" id="formTurma">
          <div class="modal-header">
            <h2 class="modal-title fs-5 fw-bold" id="tituloModal">Criar turma</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body p-4">
            <input type="hidden" id="turmaId" />
            <div class="mb-4">
              <label for="turmaNome" class="form-label fw-medium">Nome da turma</label>
              <input type="text" class="form-control form-control-lg" id="turmaNome" required maxlength="60" placeholder="Ex: Turma 3A" />
            </div>
            <div>
              <label for="turmaProfessor" class="form-label fw-medium">Professor Responsável</label>
              <select class="form-select form-select-lg" id="turmaProfessor" required></select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-link text-decoration-none" data-bs-dismiss="modal" style="color: var(--cor-texto);">Cancelar</button>
            <button type="submit" class="btn" style="background-color: var(--cor-secundaria); color: var(--cor-sobre-secundaria);">Salvar turma</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/turmas.js"></script>
    <script>
      // Atualiza o nome da barra com o usuário logado
      const usuario = usuarioLogado();
      if (usuario) {
        document.getElementById('nomeUsuarioBarra').textContent = usuario.nome.split(' ')[0];
      }
    </script>
  </body>
</html>
