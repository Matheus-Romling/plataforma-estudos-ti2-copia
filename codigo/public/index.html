<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quorbe | Entrar</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/turmas.css" />
    <script src="/assets/js/auth.js"></script>
    <style>
      .login-card {
        width: 100%;
        max-width: 380px;
        background: var(--cor-superficie);
        border: 1px solid var(--cor-borda);
        border-radius: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main class="d-flex align-items-center justify-content-center p-3">
      <div class="login-card p-4">
        <h1 class="h3 fw-bold mb-1">Quorbe</h1>
        <p class="texto-suave mb-4">Entre com seu usuário e senha.</p>

        <div id="erro" class="alert alert-danger d-none" role="alert"></div>

        <form id="formLogin">
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuário</label>
            <input type="text" class="form-control" id="usuario" autocomplete="username" required autofocus />
          </div>
          <div class="mb-4">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" class="form-control" id="senha" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn btn-primary w-100" id="btnEntrar">Entrar</button>
        </form>
      </div>
    </main>

    <script>
      const u = usuarioLogado();
      if (u && u.funcao) {
        window.location.replace('/' + u.funcao + '/home.html');
      }

      const erro = document.getElementById('erro');
      const botao = document.getElementById('btnEntrar');

      function mostrarErro(msg) {
        erro.textContent = msg;
        erro.classList.remove('d-none');
      }

      document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();
        erro.classList.add('d-none');
        botao.disabled = true;

        const usuario = document.getElementById('usuario').value.trim();
        const senha = document.getElementById('senha').value;

        try {
          const res = await fetch(
            '/usuarios?usuario=' + encodeURIComponent(usuario) +
            '&senha=' + encodeURIComponent(senha)
          );
          if (!res.ok) throw new Error('http ' + res.status);
          const achados = await res.json();

          if (achados.length === 0) {
            mostrarErro('Usuário ou senha incorretos.');
            return;
          }

          const { senha: _, ...semSenha } = achados[0];

          if (semSenha.funcao !== 'aluno' && semSenha.funcao !== 'professor') {
            mostrarErro('Esta conta não tem um perfil definido. Fale com o administrador.');
            return;
          }

          sessionStorage.setItem('usuarioCorrente', JSON.stringify(semSenha));
          window.location.href = '/' + semSenha.funcao + '/home.html';
        } catch (err) {
          mostrarErro('Não foi possível conectar ao servidor. O json-server está rodando?');
        } finally {
          botao.disabled = false;
        }
      });
    </script>
  </body>
</html>
