<!doctype html>
<html lang="pt-br" data-tema="grafite">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quorbe | Perfil Aluno</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <script src="/assets/js/auth.js"></script>
    <script>
        exigirFuncao('aluno');
    </script>
    <style>
      .dashboard-card {
        background: var(--cor-superficie);
        border: 1px solid var(--cor-borda);
        border-radius: 0.75rem;
        color: var(--cor-texto);
      }
      .perfil-avatar {
        width: 120px;
        height: 120px;
        background-color: var(--cor-secundaria);
        color: var(--cor-sobre-secundaria);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        margin: 0 auto;
        font-weight: bold;
      }
      /* Ajuste dos inputs para respeitar o tema */
      .form-control:disabled, .form-control[readonly] {
        background-color: var(--cor-fundo);
        border-color: var(--cor-borda);
        color: var(--cor-texto);
        opacity: 0.8;
      }
      .form-label {
        color: var(--cor-texto);
      }
    </style>
  </head>
  <body>
    <!-- Ícones SVG (Mantidos para a barra) -->

    <main class="d-flex flex-nowrap" style="min-height: 100vh;">
      <!-- SIDEBAR ALUNO -->
      <div class="d-flex flex-column flex-shrink-0 p-3 sidebar" style="width: 280px; background-color: var(--cor-superficie); color: var(--cor-texto);">
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
          <svg class="bi pe-none me-2" width="40" height="32" aria-hidden="true"><use href="#bootstrap"></use></svg>
          <span class="fs-4" style="color: var(--cor-texto);">Quorbe</span>
        </a>
        <hr style="border-color: var(--cor-borda);" />
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item">
            <a href="home.html" class="nav-link link-body-emphasis" style="color: var(--cor-texto) !important;">
              <svg class="bi pe-none me-2" width="16" height="16" fill="currentColor"><use href="#home"></use></svg>
              Página Inicial
            </a>
          </li>
          <li>
            <a href="tarefas.html" class="nav-link link-body-emphasis" style="color: var(--cor-texto) !important;">
              <svg class="bi pe-none me-2" width="16" height="16" fill="currentColor"><use href="#speedometer2"></use></svg>
              Tarefas
            </a>
          </li>
          <li>
            <a href="grupo.html" class="nav-link link-body-emphasis" style="color: var(--cor-texto) !important;">
              <svg class="bi pe-none me-2" width="16" height="16" fill="currentColor"><use href="#people-circle"></use></svg>
              Grupo
            </a>
          </li>
          <li>
            <a href="ranking.html" class="nav-link link-body-emphasis" style="color: var(--cor-texto) !important;">
              <svg class="bi pe-none me-2" width="16" height="16" fill="currentColor"><use href="#trophy"></use></svg>
              Ranking
            </a>
          </li>
          <li>
            <a href="calendario.html" class="nav-link link-body-emphasis" style="color: var(--cor-texto) !important;">
              <svg class="bi pe-none me-2" width="16" height="16" fill="currentColor"><use href="#grid"></use></svg>
              Calendário
            </a>
          </li>
          <!-- Perfil ATIVO aqui -->
          <li>
            <a href="perfil.html" class="nav-link active" style="background-color: var(--cor-secundaria); color: var(--cor-sobre-secundaria);">
              <svg class="bi pe-none me-2" width="16" height="16" fill="currentColor"><use href="#people-circle"></use></svg>
              Perfil
            </a>
          </li>
        </ul>
        <hr style="border-color: var(--cor-borda);" />
        <div class="dropdown">
          <a href="#" class="d-flex align-items-center link-body-emphasis text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" style="color: var(--cor-texto) !important;">
            <img src="https://github.com/mdo.png" alt="" width="32" height="32" class="rounded-circle me-2" id="imgUsuarioBarra" />
            <strong id="nomeUsuarioBarra">Usuário</strong>
          </a>
          <ul class="dropdown-menu text-small shadow" style="background-color: var(--cor-superficie);">
            <li><a class="dropdown-item" href="perfil.html" style="color: var(--cor-texto);">Perfil</a></li>
            <li><hr class="dropdown-divider" style="border-color: var(--cor-borda);" /></li>
            <li><a class="dropdown-item" href="#" onclick="sair()" style="color: var(--cor-texto);">Sair</a></li>
          </ul>
        </div>
      </div>

      <!-- CONTEÚDO PRINCIPAL (PERFIL) -->
      <div class="flex-grow-1 p-4 overflow-auto" style="background-color: var(--cor-fundo);">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
          <h4 class="mb-0 fw-bold" style="color: var(--cor-texto);">Meu Perfil</h4>
          <a href="/loja.html" class="btn" style="background-color: var(--cor-secundaria); color: var(--cor-sobre-secundaria);">Ir para a loja de cosméticos</a>
        </div>

        <div class="row g-4">
          <!-- Coluna Esquerda: Resumo -->
          <div class="col-md-4">
            <div class="dashboard-card p-4 text-center mb-4">
              <div class="perfil-avatar mb-3" id="iniciaisAvatar">U</div>
              <h5 class="fw-bold mb-1" id="perfilNomeResumo">Nome do Aluno</h5>
              <p class="text-muted mb-0" id="perfilMatriculaResumo">ALU-0000-000</p>
            </div>

            <div class="dashboard-card p-4">
              <h6 class="text-uppercase text-muted mb-3" style="font-size: 0.8rem; letter-spacing: 1px;">Estatísticas de Estudo</h6>
              
              <div class="d-flex justify-content-between align-items-center mb-3">
                <span style="color: var(--cor-texto);">Orbes Acumulados</span>
                <span class="fw-bold" style="color: var(--cor-primaria);" id="perfilOrbes">0</span>
              </div>
              
              <div class="d-flex justify-content-between align-items-center">
                <span style="color: var(--cor-texto);">Sequência (Dias)</span>
                <span class="fw-bold" style="color: var(--cor-terciaria);" id="perfilSequencia">0</span>
              </div>
            </div>
          </div>

          <!-- Coluna Direita: Detalhes/Formulário -->
          <div class="col-md-8">
            <div class="dashboard-card p-4">
              <h5 class="fw-bold border-bottom pb-2 mb-4" style="border-color: var(--cor-borda) !important; color: var(--cor-texto);">Informações Pessoais</h5>
              
              <form>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" id="inputNome" readonly>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Nome de Usuário</label>
                    <input type="text" class="form-control" id="inputUsuario" readonly>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="inputEmail" readonly>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Matrícula</label>
                    <input type="text" class="form-control" id="inputMatricula" readonly>
                  </div>
                </div>

                <div class="mt-4 pt-3 border-top" style="border-color: var(--cor-borda) !important;">
                  <button type="button" class="btn" style="background-color: var(--cor-secundaria); color: var(--cor-sobre-secundaria);">
                    Solicitar Alteração de Dados
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const usuario = usuarioLogado();
      if (usuario) {
        // Preenche Barra
        document.getElementById('nomeUsuarioBarra').textContent = usuario.nome.split(' ')[0];

        // Preenche Resumo Perfil
        const nomePartes = usuario.nome.split(' ');
        let iniciais = nomePartes[0][0];
        if (nomePartes.length > 1) iniciais += nomePartes[nomePartes.length - 1][0];
        
        document.getElementById('iniciaisAvatar').textContent = iniciais.toUpperCase();
        document.getElementById('perfilNomeResumo').textContent = usuario.nome;
        document.getElementById('perfilMatriculaResumo').textContent = usuario.matricula || 'Sem Matrícula';
        document.getElementById('perfilOrbes').textContent = usuario.orbes || '0';
        document.getElementById('perfilSequencia').textContent = usuario.sequenciaEstudos || '0';

        // Preenche Formulário
        document.getElementById('inputNome').value = usuario.nome;
        document.getElementById('inputUsuario').value = usuario.usuario;
        document.getElementById('inputEmail').value = usuario.email;
        document.getElementById('inputMatricula').value = usuario.matricula || '';

        document.documentElement.setAttribute('data-tema', 'grafite');
      }
    </script>
  </body>
</html>
