<!doctype html>
<html lang="pt-br" data-tema="grafite">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quorbe | Minhas Conquistas</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/style.css">

  <script src="/assets/js/auth.js"></script>
  <script>
    exigirFuncao('aluno');

    document.documentElement.setAttribute('data-tema', 'grafite');
  </script>

  <style>
    .pagina-conquistas {
      min-height: 100vh;
      background-color: var(--cor-fundo);
      color: var(--cor-texto);
    }

    .card-conquista {
      background-color: var(--cor-superficie);
      border: 1px solid var(--cor-borda);
      border-radius: 12px;
      color: var(--cor-texto);
      height: 100%;
    }

    .icone-conquista {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      border-radius: 50%;
      background-color: var(--cor-fundo);
      font-size: 30px;
    }

    .texto-secundario {
      color: var(--cor-texto);
      opacity: 0.75;
    }

    .status-conquista {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      background-color: var(--cor-borda);
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <main class="pagina-conquistas p-4">
    <div class="container">

      <a
        href="home.html"
        class="text-decoration-none texto-secundario"
      >
        ← Voltar para a página inicial
      </a>

      <h1 class="fw-bold mt-3">🏆 Minhas Conquistas</h1>

      <p class="texto-secundario mb-4">
        Consulte as conquistas disponíveis na plataforma Quorbe.
      </p>

      <div
        id="mensagemLista"
        class="texto-secundario mb-3"
        role="status"
        aria-live="polite"
      >
        Carregando conquistas...
      </div>

      <div id="listaConquistas" class="row g-3"></div>

    </div>
  </main>

  <script>
    const API_URL = '/conquistas';

    async function carregarConquistas() {
      const lista = document.getElementById('listaConquistas');
      const mensagem = document.getElementById('mensagemLista');

      try {
        const resposta = await fetch(API_URL);

        if (!resposta.ok) {
          throw new Error('Falha ao carregar conquistas.');
        }

        const conquistas = await resposta.json();

        lista.replaceChildren();

        if (conquistas.length === 0) {
          mensagem.textContent =
            'Nenhuma conquista disponível no momento.';
          return;
        }

        mensagem.textContent =
          `${conquistas.length} conquista(s) disponível(is).`;

        conquistas.forEach(conquista => {
          const coluna = document.createElement('div');
          coluna.className = 'col-md-6 col-lg-4';

          const card = document.createElement('article');
          card.className = 'card-conquista p-4 text-center';

          const icone = document.createElement('div');
          icone.className = 'icone-conquista';
          icone.textContent = conquista.icone || '🏆';

          const titulo = document.createElement('h2');
          titulo.className = 'h5 fw-bold';
          titulo.textContent = conquista.nome;

          const descricao = document.createElement('p');
          descricao.className = 'texto-secundario';
          descricao.textContent =
            conquista.descricao || 'Sem descrição.';

          const status = document.createElement('span');
          status.className = 'status-conquista';
          status.textContent = 'Disponível';

          card.append(icone, titulo, descricao, status);
          coluna.appendChild(card);
          lista.appendChild(coluna);
        });

      } catch (erro) {
        mensagem.textContent =
          'Não foi possível carregar as conquistas. Verifique se o servidor está funcionando.';
      }
    }

    carregarConquistas();
  </script>
</body>
</html>
